[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendecisions"
version = "0.1.0"
description = "Open models and one server for the Decisions API: typed, calibrated decisions over text, images and video"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["decisions", "decisions-api", "system-one", "classification", "multimodal", "llama.cpp", "onejev"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
]
dependencies = [
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "transformers>=5.0",
  "huggingface_hub>=0.30",
  "pillow>=10",
  "jinja2>=3.1",
]

[project.optional-dependencies]
torch = ["torch>=2.6", "torchvision>=0.21", "accelerate>=1.0", "safetensors>=0.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/OpenDecisions/OpenDecisions"
Models = "https://huggingface.co/collections/OmniJev/onejev"

[project.scripts]
opendecisions = "opendecisions.cli:main"

[tool.setuptools.packages.find]
include = ["opendecisions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
